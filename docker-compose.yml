services:
  redis:
    image: redis:7-alpine
    container_name: b2b-redis
    restart: unless-stopped
    networks:
      - b2b-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: b2b-backend
    ports:
      - '8000:8000'
    env_file:
      - ./backend/.env
    environment:
      # Dockerfile defaults to 8080 (Cloud Run). Local compose publishes 8000.
      - PORT=8000
      # Local: canvas WS works without JWT secret / GoTrue round-trips
      - ALLOW_INSECURE_CANVAS_WS=true
      - ENVIRONMENT=development
      # backend/.env often points at localhost:6379 (host). Inside Compose use the redis service.
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - b2b-network

  frontend:
    build:
      context: .
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - INTERNAL_API_URL=http://backend:8000
        # Local Docker LIVE: cursors + Yjs co-edit over FastAPI WebSocket
        - NEXT_PUBLIC_DISABLE_LIVE=false
        - NEXT_PUBLIC_COLLAB_DOC_SYNC=true
      dockerfile: Dockerfile
    container_name: b2b-frontend
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - INTERNAL_API_URL=http://backend:8000
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - FEATURE_FLAGS_DISABLED=true
      # Runtime mirror (baked args still required for NEXT_PUBLIC_*)
      - NEXT_PUBLIC_DISABLE_LIVE=false
      - NEXT_PUBLIC_COLLAB_DOC_SYNC=true
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - b2b-network

networks:
  b2b-network:
    driver: bridge
