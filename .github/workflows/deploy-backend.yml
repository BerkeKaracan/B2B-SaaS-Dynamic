name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/**'

env:
  PROJECT_ID: b2b-saas-dynamic
  REGION: europe-west3
  SERVICE: b2b-backend-service
  IMAGE: europe-west3-docker.pkg.dev/b2b-saas-dynamic/backend-repo/b2b-backend

# Least privilege for this workflow (checkout + deploy via GCP_CREDENTIALS secret).
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker Auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          docker build -f backend/Dockerfile -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest backend
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Prepare Cloud Run env vars
        id: envprep
        env:
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          FEATURE_FLAGS_URL: ${{ secrets.FEATURE_FLAGS_URL }}
          FEATURE_FLAGS_API_KEY: ${{ secrets.FEATURE_FLAGS_API_KEY }}
        run: |
          set -euo pipefail
          {
            echo "ENVIRONMENT=production"
            if [ -n "${SUPABASE_JWT_SECRET// }" ]; then
              echo "SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}"
              echo "JWT secret will be merged into Cloud Run." >&2
            else
              echo "::warning::JWT GitHub secret empty — not overwriting Cloud Run JWT env." >&2
            fi
            if [ -n "${FEATURE_FLAGS_URL// }" ] && [ -n "${FEATURE_FLAGS_API_KEY// }" ]; then
              echo "FEATURE_FLAGS_URL=${FEATURE_FLAGS_URL}"
              echo "FEATURE_FLAGS_API_KEY=${FEATURE_FLAGS_API_KEY}"
              echo "Pulse Flag URL+delivery key will be merged into Cloud Run." >&2
            else
              echo "::warning::FEATURE_FLAGS_URL/API_KEY incomplete — not overwriting Cloud Run Pulse env." >&2
            fi
          } > /tmp/cloudrun.env
          echo "cloudrun.env keys:" >&2
          cut -d= -f1 /tmp/cloudrun.env >&2
          {
            echo "vars<<EOF"
            cat /tmp/cloudrun.env
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          env_vars: ${{ steps.envprep.outputs.vars }}
          env_vars_update_strategy: merge
          secrets_update_strategy: merge
