name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/**'

env:
  PROJECT_ID: b2b-saas-dynamic
  REGION: europe-west3
  SERVICE: b2b-backend-service
  IMAGE: europe-west3-docker.pkg.dev/b2b-saas-dynamic/backend-repo/b2b-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker Auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          docker build -f backend/Dockerfile -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest backend
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      # Critical: empty GitHub secret expands to SUPABASE_JWT_SECRET= and
      # merge-overwrites a non-empty Console value with "".
      - name: Require non-empty SUPABASE_JWT_SECRET
        env:
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_JWT_SECRET// }" ]; then
            echo "::error::GitHub Actions secret SUPABASE_JWT_SECRET is empty or missing."
            echo "GitHub → Settings → Secrets and variables → Actions → New repository secret"
            echo "Name: SUPABASE_JWT_SECRET"
            echo "Value: Supabase → Project Settings → API → JWT Secret (not anon/service_role)"
            exit 1
          fi
          echo "SUPABASE_JWT_SECRET length=${#SUPABASE_JWT_SECRET}"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          env_vars: |-
            SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }}
            ENVIRONMENT=production
          env_vars_update_strategy: merge
          secrets_update_strategy: merge
