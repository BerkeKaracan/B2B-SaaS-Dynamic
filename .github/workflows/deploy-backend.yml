name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/**'

env:
  PROJECT_ID: b2b-saas-dynamic
  REGION: europe-west3
  SERVICE: b2b-backend-service
  IMAGE: europe-west3-docker.pkg.dev/b2b-saas-dynamic/backend-repo/b2b-backend

# Least privilege for this workflow (checkout + deploy via GCP_CREDENTIALS secret).
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker Auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          docker build -f backend/Dockerfile -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest backend
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      # Empty GitHub secret must NEVER be written as SUPABASE_JWT_SECRET=
      # (merge would overwrite a good Console value with "").
      - name: Check SUPABASE_JWT_SECRET
        id: jwt
        env:
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        run: |
          if [ -z "${SUPABASE_JWT_SECRET// }" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::JWT GitHub secret is empty — deploying image without touching that Cloud Run env var (Auth API fallback remains available)."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "JWT GitHub secret is present (non-empty)."
          fi

      - name: Deploy to Cloud Run (with JWT secret)
        if: steps.jwt.outputs.present == 'true'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          env_vars: |-
            SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }}
            ENVIRONMENT=production
          env_vars_update_strategy: merge
          secrets_update_strategy: merge

      - name: Deploy to Cloud Run (without overwriting JWT)
        if: steps.jwt.outputs.present != 'true'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          env_vars: |-
            ENVIRONMENT=production
          env_vars_update_strategy: merge
          secrets_update_strategy: merge
